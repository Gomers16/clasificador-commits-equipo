name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ruff
        run: pip install ruff
      - name: Ejecutar ruff
        run: ruff check app/

  construir:
    needs: calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen Docker
        run: docker build -t api-ia:${{ github.sha }} .

  pruebas:
    needs: calidad
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clasificador_commits
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changeme_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clasificador_commits"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: clasificador_commits
      DB_USER: app_ia
      DB_PASSWORD: app_ia_password

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias (incluye dev)
        run: pip install -r requirements-dev.txt
      - name: Inicializar esquema de base de datos
        env:
          PGPASSWORD: changeme_admin
        run: psql -h localhost -U postgres -d clasificador_commits -f db/init.sql
      - name: Ejecutar pruebas
        run: pytest -v
